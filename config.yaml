name: "Familienfest-Planer"
version: "1.1.0"
slug: "familienfest_planer"
description: "Zeitplan- und Anmelde-Tool fuer das Familienfest"
url: "https://github.com/<DEIN-GITHUB-USER>/<DEIN-REPO-NAME>/tree/main/familienfest_planer"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto

# Erscheint als eigene Karte im HA-Menue (Ingress)
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-star
panel_title: "Familienfest"

# Zusaetzlich weiterhin direkt per Port erreichbar,
# z. B. fuer Familienmitglieder ohne eigenen HA-Account
# (wie bisher per Reverse Proxy / DDNS von aussen).
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Direkter Zugriff ohne Home-Assistant-Login (fuer Familie von unterwegs)"

# /data wird von Home Assistant automatisch angelegt, ist dauerhaft
# und wird bei Supervisor-Backups automatisch mitgesichert.
options:
  admin_code: "admin2026"
  session_secret: ""
schema:
  admin_code: str
  session_secret: str?
